apiVersion: apps/v1
kind: Deployment

metadata:
  name: rakuten-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: rakuten-api

  template:
    metadata:
      labels:
        app: rakuten-api

    spec:
      containers:
      - name: fastapi
        image:  my-fast-api:latest
        imagePullPolicy: IfNotPresent

        resources:
          requests:
            memory: "60Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
          
        ports:
        - containerPort: 8000